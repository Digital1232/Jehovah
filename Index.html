<body data-template-id="__page-root">
    <div id="appView" class="app-shell">
        <aside id="sidebar" class="sidebar">
            <div class="brand flex items-center gap-3">
                <div class="brand-mark">
                    <i data-lucide="building-2" class="w-5 h-5"></i>
                </div>
                <div>
                    <strong class="text-white text-sm font-bold block leading-tight">Jehovah Nissi</strong>
                    <span class="block text-[11px] text-blue-400 font-medium">Enterprise CRM</span>
                </div>
            </div>
            <nav id="mainNav" class="nav" aria-label="CRM navigation"></nav>
            <div class="m-3 mt-auto p-3.5 rounded-xl bg-slate-800/80 text-xs border border-slate-700/50">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <strong id="roleSidebar" class="text-white font-semibold"></strong>
                </div>
                <p id="sidebarScope" class="mt-1 text-slate-400 text-[11px] leading-tight"></p>
            </div>
        </aside>
        <section class="workspace">
            <header class="topbar">
                <div class="flex items-center gap-3">
                    <button id="menuBtn" class="btn btn-outline p-2 lg:hidden" aria-label="Open navigation">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    <div>
                        <span id="workspaceCategory" class="text-[11px] font-bold tracking-wider text-blue-600 uppercase block">WORKSPACE</span>
                        <h1 id="workspaceTitle" class="text-lg font-bold text-slate-900 leading-none mt-0.5">Dashboard</h1>
                    </div>
                </div>

                <!-- Global Command Search -->
                <div class="relative w-72 hide-mobile">
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                        <input id="globalSearchInput" type="text" class="input pl-9 text-xs py-2 bg-slate-50 focus:bg-white" placeholder="Search clients, enquiries, projects (Cmd+K)..." />
                    </div>
                    <div id="searchResultsPopup" class="search-results-popup hidden"></div>
                </div>

                <div class="flex items-center gap-2.5">
                    <select id="branchSelect" class="select w-40 py-1.5 text-xs hide-mobile" aria-label="Select branch"></select>
                    
                    <!-- DEMO ROLE SWITCHER -->
                    <div class="flex items-center gap-1.5 bg-blue-50 border border-blue-200 rounded-lg p-1">
                        <span class="text-[10px] font-bold text-blue-800 uppercase px-1.5 hide-mobile">View Demo As:</span>
                        <select id="roleSelect" class="select border-0 bg-white py-1.5 text-xs font-semibold text-blue-900 rounded focus:ring-0" aria-label="View demo as role"></select>
                    </div>

                    <button id="demoBtn" class="btn btn-secondary py-1.5 px-3 hide-mobile" title="Run Guided Role Tour">
                        <i data-lucide="play-circle" class="w-4 h-4 text-blue-600"></i>
                        <span class="text-xs">Demo Tour</span>
                    </button>
                    
                    <button id="notificationBtn" class="btn btn-outline p-2 relative" aria-label="Open notifications">
                        <i data-lucide="bell" class="w-4 h-4 text-slate-600"></i>
                        <span id="notifBadge" class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-red-600 text-white text-[9px] font-bold grid place-items-center">3</span>
                    </button>
                </div>
            </header>
            <main id="content" class="content"></main>
        </section>
        <nav id="mobileNav" class="mobile-nav" aria-label="Mobile CRM navigation"></nav>
    </div>

    <div id="overlayRoot"></div>
    <div id="toast" class="hidden fixed right-6 bottom-6 z-[120] rounded-xl bg-slate-900 px-4 py-3 text-sm text-white shadow-2xl flex items-center gap-2 border border-slate-800"></div>
